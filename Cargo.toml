[package]
name = "soupdb-driver"
version = "0.2.0"
edition = "2021"
description = "Driver Rust para SoupDB (gestor de base de datos multimodal)"
license = "MIT"
repository = "https://github.com/BD2-Project/rsoup"
homepage = "https://github.com/BD2-Project/rsoup"
documentation = "https://docs.rs/soupdb-driver"
readme = "README.md"
keywords = ["database", "driver", "soupdb", "tcp", "protocol"]
categories = ["database", "network-programming"]
publish = true

# El nombre del paquete en crates.io es `soupdb-driver`, pero se conserva el
# nombre de librería `rsoup` para no romper `use rsoup::...` en consumidores
# (p. ej. SoupChef). Los bins también conservan sus nombres.
[lib]
name = "rsoup"
path = "src/lib.rs"

[features]
default = []
# Transporte TLS opt-in. El gestor todavía no hace handshake TLS (trabajo
# futuro); esta feature deja el driver listo para cuando lo soporte.
tls = ["dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "rsoup"
path = "src/main.rs"

[[bin]]
name = "soup_tui"
path = "src/bin/soup_tui.rs"
