name: release

on:
  push:
    tags:
      - "v*"

# Publica el crate `soupdb-driver` en crates.io al empujar un tag `vX.Y.Z`.
# Requiere el secret de repositorio `CARGO_REGISTRY_TOKEN` (API token de
# crates.io con permiso de publicación). Si falta, el job falla sin publicar.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verificar antes de publicar
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Empaquetar (dry-run)
        run: cargo publish --dry-run

      - name: Publicar en crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
